<!-- manifest.json + theme-color = syarat PWA supaya bisa "Instal Aplikasi" (lihat sw.js utk
     catatan lengkap -- hanya aktif kalau dibuka lewat http(s), bukan file:// langsung). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D47444">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<!-- "?v=" di tiap file CSS/JS/gambar di bawah ini SENGAJA ada -- ini "cache-busting": browser
     menganggap URL dgn query string berbeda sbg file yg berbeda sama sekali, jadi tidak akan
     memakai salinan lama yg ke-cache dari kunjungan sebelumnya ke folder yg sama. Kalau ke depan
     ada pembaruan file index.html/assets, GANTI NILAI "v=20260924m" di semua tag ini (cukup
     cari-ganti satu nilai yg sama) supaya versi terbaru pasti termuat, bukan versi lama dari cache
     browser. -->
<link rel="stylesheet" href="assets/css/style.css?v=20260924m">
</head>

<!-- Gerbang login (lihat assets/js/auth.js & assets/js/firebase-init.js -- pakai Firebase
     Authentication sungguhan, bukan cuma dicek di browser). Sengaja TIDAK dikasih atribut
     "hidden" di sini (tampil dulu by default) supaya kalau JS gagal dimuat, app tetap tidak
     kebuka (gagal-tertutup, bukan gagal-terbuka). -->
<div id="gerbangKunci" class="gerbang-kunci">
  <div class="gerbang-kunci__kotak">
    <img src="assets/img/logo.png?v=20260924m" alt="" class="gerbang-kunci__logo">
    <h1>Senantiasa</h1>
    <!-- Firebase butuh sepersekian detik utk pastikan sesi login lama masih berlaku (baca dari
         penyimpanan browser) -- selama itu yg tampil status netral ini DULU, form login (dgn
         kolom email/password) baru dimunculkan kalau ternyata BENAR belum/tidak login. Ini spy
         user yg sesinya masih valid tidak lihat form login "kedip" sekejap tiap refresh. -->
    <p id="statusGerbang">Memeriksa sesi login...</p>
    <form id="formGerbangKunci" hidden>
      <input type="email" id="inputEmailGerbang" placeholder="Email" autocomplete="username">
      <input type="password" id="inputGerbangKunci" placeholder="Password" autocomplete="current-password">
      <button type="submit">Masuk</button>
    </form>
    <p id="errorGerbangKunci" class="gerbang-kunci__error" hidden>Password salah, coba lagi.</p>
  </div>
</div>
<script type="module" src="assets/js/firebase-init.js?v=20260924m"></script>
<script src="assets/js/auth.js?v=20260924m"></script>
